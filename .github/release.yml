changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: ⚠️ Breaking Changes
      labels:
        - breaking
    - title: 🎉 New Features
      labels:
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
    - title: 📝 Documentation
      labels:
        - documentation
    - title: 🏗️ Build and CI
      labels:
        - github_actions
    - title: 📦 Dependencies
      labels:
        - dependencies
    - title: 🔧 Other Changes
      labels:
        - "*"
