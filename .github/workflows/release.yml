name: Release

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and publish to nuget.org
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      attestations: write # Build provenance attestations
      id-token: write # NuGet trusted publishing and attestation signing
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build solution and run tests
        uses: ThorstenSauter/dotnet-actions/build-and-test@be6b6794832821fbad29da607b6ac88e9c74ffdf # v4.1.0
      - name: Pack and publish
        uses: ThorstenSauter/dotnet-actions/pack-and-publish@be6b6794832821fbad29da607b6ac88e9c74ffdf # v4.1.0
        with:
          # The solution packs both packages, which always ship with the same version.
          project-path: 'Azure.Cosmos.Migrations.slnx'
          version: ${{ github.event.release.tag_name }}
          nuget-user: ${{ vars.NUGET_USER }}
