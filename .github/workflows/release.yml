name: Release

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Runs the tests without any token that can publish: test code and its dependencies never see the OIDC token
  # that nuget.org trusted publishing exchanges for an API key.
  test:
    name: Verify and test
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the tagged commit is on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag '$TAG' points at $GITHUB_SHA, which is not on main. Only merged commits are released."
            exit 1
          fi
      - name: Build solution and run tests
        uses: ThorstenSauter/dotnet-actions/build-and-test@v4.3.0

  publish:
    name: Pack and publish to nuget.org
    needs: test
    runs-on: ubuntu-26.04-arm
    environment: nuget
    permissions:
      contents: read
      attestations: write # Build provenance attestations
      id-token: write # NuGet trusted publishing and attestation signing
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Pack and publish
        uses: ThorstenSauter/dotnet-actions/pack-and-publish@v4.3.0
        with:
          # The solution packs both packages, which always ship with the same version.
          project-path: 'Azure.Cosmos.Migrations.slnx'
          version: ${{ github.event.release.tag_name }}
          nuget-user: ${{ vars.NUGET_USER }}
